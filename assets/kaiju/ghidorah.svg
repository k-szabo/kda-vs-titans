<svg viewBox="0 0 280 190" width="100%" height="100%" style="filter: drop-shadow(0 6px 18px rgba(0,0,0,0.95))" fill="none">
          <defs>
            <linearGradient id="kgGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fde047"/>
              <stop offset="48%" stop-color="#d97706"/>
              <stop offset="100%" stop-color="#78350f"/>
            </linearGradient>
            <linearGradient id="kgWingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#facc15" stop-opacity="0.88"/>
              <stop offset="65%" stop-color="#b45309" stop-opacity="0.82"/>
              <stop offset="100%" stop-color="#451a03" stop-opacity="0.92"/>
            </linearGradient>
          </defs>

          <!-- Massive Bat-Like Golden Wings -->
          <path d="M126,106 L22,22 L44,58 L14,66 L48,92 L24,114 L78,120 L114,132 Z" fill="url(#kgWingGrad)" stroke="#fef08a" stroke-width="1.3"/>
          <path d="M154,106 L258,22 L236,58 L266,66 L232,92 L256,114 L202,120 L166,132 Z" fill="url(#kgWingGrad)" stroke="#fef08a" stroke-width="1.3"/>
          <!-- Wing Bone Struts -->
          <g stroke="#fef08a" stroke-width="1.2" opacity="0.75">
            <line x1="122" y1="110" x2="44" y2="58"/>
            <line x1="120" y1="114" x2="48" y2="92"/>
            <line x1="158" y1="110" x2="236" y2="58"/>
            <line x1="160" y1="114" x2="232" y2="92"/>
          </g>

          <!-- Twin Whipping Tails -->
          <path d="M124,154 C96,164 68,158 46,174 L36,170 L44,180 L34,184 L52,180 C76,168 102,172 130,164 Z" fill="url(#kgGoldGrad)"/>
          <path d="M156,154 C184,164 212,158 234,174 L244,170 L236,180 L246,184 L228,180 C204,168 178,172 150,164 Z" fill="url(#kgGoldGrad)"/>

          <!-- Central Scaled Torso & Legs -->
          <path d="M114,104 L166,104 L174,152 L162,184 L148,184 L146,158 L134,158 L132,184 L118,184 L106,152 Z" fill="url(#kgGoldGrad)" stroke="#fef08a" stroke-width="1.2"/>

          <!-- Left Serpentine Neck & Horned Dragon Head -->
          <path d="M122,110 C104,92 84,82 78,60 C74,46 84,36 92,34" stroke="url(#kgGoldGrad)" stroke-width="13" stroke-linecap="round"/>
          <g transform="translate(64,18)">
            <polygon points="24,14 8,2 18,16" fill="#fef08a"/>
            <polygon points="30,12 22,0 26,15" fill="#fef08a"/>
            <polygon points="28,14 10,20 14,26 30,24" fill="url(#kgGoldGrad)" stroke="#fef08a" stroke-width="1"/>
            <circle cx="19" cy="19" r="1.8" fill="#ef4444"/>
            <polyline points="10,23 2,21 -4,25" stroke="#38bdf8" stroke-width="1.3" class="kaiju-spines"/>
          </g>

          <!-- Center Towering Neck & Crowned Dragon Head -->
          <path d="M140,104 C138,80 142,58 140,34" stroke="url(#kgGoldGrad)" stroke-width="15" stroke-linecap="round"/>
          <g transform="translate(124,6)">
            <polygon points="10,16 2,2 14,14" fill="#fef08a"/>
            <polygon points="16,13 16,0 20,13" fill="#fef08a"/>
            <polygon points="22,16 30,2 18,14" fill="#fef08a"/>
            <polygon points="8,15 24,15 22,28 10,28" fill="url(#kgGoldGrad)" stroke="#fef08a" stroke-width="1"/>
            <circle cx="12" cy="20" r="1.8" fill="#ef4444"/>
            <circle cx="20" cy="20" r="1.8" fill="#ef4444"/>
            <polyline points="16,28 13,36 18,42" stroke="#38bdf8" stroke-width="1.5" class="kaiju-spines"/>
          </g>

          <!-- Right Serpentine Neck & Horned Dragon Head -->
          <path d="M158,110 C176,92 196,82 202,60 C206,46 196,36 188,34" stroke="url(#kgGoldGrad)" stroke-width="13" stroke-linecap="round"/>
          <g transform="translate(184,18)">
            <polygon points="8,14 24,2 14,16" fill="#fef08a"/>
            <polygon points="2,12 10,0 6,15" fill="#fef08a"/>
            <polygon points="4,14 22,20 18,26 2,24" fill="url(#kgGoldGrad)" stroke="#fef08a" stroke-width="1"/>
            <circle cx="13" cy="19" r="1.8" fill="#ef4444"/>
            <polyline points="22,23 30,21 36,25" stroke="#38bdf8" stroke-width="1.3" class="kaiju-spines"/>
          </g>
        </svg>
