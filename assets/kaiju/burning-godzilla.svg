            <polygon points="164,74 196,46 184,78"/>
            <polygon points="172,96 208,68 190,102"/>
            <polygon points="178,118 210,96 192,126"/>
            <polygon points="184,140 212,124 196,148"/>
          </g>

          <!-- Primary Glowing Dorsal Plates -->
