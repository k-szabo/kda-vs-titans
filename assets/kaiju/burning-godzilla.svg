            <polygon points="150,58 186,24 174,64"/>
            <polygon points="158,82 206,42 186,88"/>
            <polygon points="166,106 218,68 194,114"/>
            <polygon points="174,130 216,102 196,138"/>
            <polygon points="184,152 218,134 202,160"/>
            <polygon points="198,168 228,156 214,175"/>
