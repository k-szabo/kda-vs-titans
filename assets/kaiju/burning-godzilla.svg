<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 190" width="260" height="190" style="filter: drop-shadow(0 6px 18px rgba(0,0,0,0.95))" fill="none">
          <defs>
            <linearGradient id="gzBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2c3545"/>
              <stop offset="55%" stop-color="#141923"/>
              <stop offset="100%" stop-color="#07090e"/>
            </linearGradient>
            <linearGradient id="gzSpineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fef08a"/>
              <stop offset="50%" stop-color="#f97316"/>
              <stop offset="100%" stop-color="#dc2626"/>
            </linearGradient>
          </defs>

          <!-- Jagged Maple-Leaf Dorsal Plates (Back Row) -->
