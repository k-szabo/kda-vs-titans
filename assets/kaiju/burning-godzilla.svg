          <g stroke="#334155" stroke-width="1.6" stroke-linecap="round">
            <path d="M126,44 C122,52 122,60 126,68"/>
            <path d="M133,46 C129,54 129,62 133,70"/>
            <path d="M140,48 C136,56 136,64 140,72"/>
            <path d="M104,68 C118,72 132,72 146,66"/>
            <path d="M100,82 C116,87 134,87 150,80"/>
            <path d="M98,96 C116,102 136,102 154,94"/>
            <path d="M96,112 C116,118 138,118 158,110"/>
          </g>

          <!-- Foreground Arm & Claws -->
          <path d="M118,86 L94,104 L76,102 L68,112 L76,112 L82,107 L98,112 L124,98" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        </svg>
