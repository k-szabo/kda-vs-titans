          <!-- Sweeping Tail & Massive Torso Silhouette -->
          <path d="M248,182 C226,178 206,164 192,144 C180,124 172,96 160,72 C152,55 144,38 134,26 C125,16 108,14 96,18 L72,22 C66,24 64,29 68,33 L94,36 L94,41 L74,45 C71,47 72,52 77,53 L102,52 C104,64 96,74 84,82 L64,92 L58,104 L67,103 L72,97 L92,94 C90,116 84,142 74,168 L62,186 L168,186 C174,168 176,154 182,158 C198,170 220,185 252,188 Z" fill="url(#gzBodyGrad)" stroke="#475569" stroke-width="1.3"/>

          <!-- Mouth Interior Glow & Atomic Breath Charge Core -->
          <polygon points="70,33 95,36 95,41 75,45 86,39" fill="#fef08a"/>

          <!-- Upper & Lower Jagged Teeth -->
          <g fill="#f8fafc">
            <polygon points="72,33 75,37 78,34"/>
            <polygon points="80,34 83,38 86,35"/>
            <polygon points="88,35 91,38 93,36"/>
            <polygon points="76,45 79,41 82,44"/>
            <polygon points="84,44 87,40 90,43"/>
          </g>

          <!-- Piercing Brow Ridge & Glowing Eye -->
          <path d="M96,23 L112,20 L118,26" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
          <polygon points="100,25 107,24 104,28" fill="#fef08a"/>

