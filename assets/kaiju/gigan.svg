<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190" style="filter: drop-shadow(0 6px 18px rgba(0,0,0,0.95))" fill="none">
  <defs>
    <linearGradient id="giganSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a29e"/>
      <stop offset="55%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="giganSaw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e7e5e4"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
  </defs>
  <!-- Hover jets -->
  <path d="M112,150 L104,172 M168,150 L176,172" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="104" cy="176" rx="8" ry="3" fill="#fdba74" opacity="0.8"/>
  <ellipse cx="176" cy="176" rx="8" ry="3" fill="#fdba74" opacity="0.8"/>
  <!-- Cyborg torso -->
  <path d="M118,84 L162,84 L156,148 L124,148 Z" fill="url(#giganSteel)" stroke="#e7e5e4" stroke-width="1.4"/>
  <circle cx="140" cy="112" r="9" fill="#1c1917" stroke="#ef4444" stroke-width="2"/>
  <circle cx="140" cy="112" r="3.5" fill="#ef4444"/>
  <!-- Buzzsaw arm (left) -->
  <path d="M120,100 L76,110" stroke="#57534e" stroke-width="7" stroke-linecap="round"/>
  <circle cx="62" cy="112" r="20" fill="none" stroke="url(#giganSaw)" stroke-width="6"/>
  <path d="M62,92 L62,132 M42,112 L82,112 M48,98 L76,126 M48,126 L76,98" stroke="#a8a29e" stroke-width="1.6"/>
  <!-- Hook arm (right) -->
  <path d="M160,100 L196,88" stroke="#57534e" stroke-width="7" stroke-linecap="round"/>
  <path d="M196,88 L214,68 M196,88 L216,92" stroke="url(#giganSaw)" stroke-width="5" stroke-linecap="round"/>
  <!-- Visor eye -->
  <path d="M126,72 L154,72 L150,60 L130,60 Z" fill="#1c1917" stroke="#e7e5e4" stroke-width="1.2"/>
  <path d="M130,66 L150,66" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Dorsal lasers -->
  <path d="M128,84 L120,60 M152,84 L160,60" stroke="#78716c" stroke-width="3" stroke-linecap="round"/>
</svg>
