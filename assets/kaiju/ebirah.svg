  <circle cx="128" cy="68" r="4" fill="#fef08a" stroke="#431407" stroke-width="1.5"/>
  <circle cx="152" cy="68" r="4" fill="#fef08a" stroke="#431407" stroke-width="1.5"/>
  <path d="M120,92 L70,66 M160,92 L210,66" stroke="#fdba74" stroke-width="1.6" stroke-linecap="round"/>
