  </defs>
  <!-- Walking legs -->
  <path d="M104,132 L74,152 L52,148 M108,144 L80,168 L60,170 M176,132 L206,152 L228,148 M172,144 L200,168 L220,170" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>
