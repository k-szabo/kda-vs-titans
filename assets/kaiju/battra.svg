  <polygon points="140,78 132,34 140,52 148,34" fill="#fbbf24" stroke="#78350f" stroke-width="1.2"/>
  <polygon points="124,80 108,52 122,72" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
  <polygon points="156,80 172,52 158,72" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
  <!-- Burning red eyes -->
  <circle cx="132" cy="88" r="4" fill="#ef4444"/>
  <circle cx="148" cy="88" r="4" fill="#ef4444"/>
  <circle cx="132" cy="88" r="1.5" fill="#fecaca"/>
  <circle cx="148" cy="88" r="1.5" fill="#fecaca"/>
</svg>
