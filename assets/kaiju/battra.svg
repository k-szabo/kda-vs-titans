  </defs>
  <!-- Broad dark wings -->
  <path d="M134,96 L16,44 L44,84 L22,104 L70,112 L126,116 Z" fill="url(#batWing)" stroke="#ef4444" stroke-width="1.4"/>
  <path d="M146,96 L264,44 L236,84 L258,104 L210,112 L154,116 Z" fill="url(#batWing)" stroke="#ef4444" stroke-width="1.4"/>
