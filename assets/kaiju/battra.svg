<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190" style="filter: drop-shadow(0 6px 18px rgba(0,0,0,0.95))" fill="none">
  <defs>
    <linearGradient id="batWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="55%" stop-color="#1f0a1e"/>
      <stop offset="100%" stop-color="#0a0a12"/>
