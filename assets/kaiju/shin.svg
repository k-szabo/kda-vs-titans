<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 190" width="260" height="190" style="filter: drop-shadow(0 6px 18px rgba(0,0,0,0.95))" fill="none">
          <defs>
            <linearGradient id="shinBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7f1d1d"/>
              <stop offset="55%" stop-color="#450a0a"/>
              <stop offset="100%" stop-color="#160404"/>
            </linearGradient>
            <linearGradient id="shinSpineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fecaca"/>
              <stop offset="50%" stop-color="#f97316"/>
              <stop offset="100%" stop-color="#dc2626"/>
            </linearGradient>
          </defs>

          <!-- Jagged Maple-Leaf Dorsal Plates (Back Row, dim) -->
          <g fill="url(#shinSpineGrad)" opacity="0.55">
            <polygon points="150,66 168,48 164,70"/>
            <polygon points="158,90 184,66 174,94"/>
            <polygon points="164,114 194,94 182,120"/>
            <polygon points="170,138 196,122 186,146"/>
          </g>

          <!-- Primary Glowing Dorsal Plates -->
          <g fill="url(#shinSpineGrad)" stroke="#fecaca" stroke-width="1" class="kaiju-spines">
            <polygon points="140,52 158,32 154,58"/>
            <polygon points="148,74 178,44 168,80"/>
            <polygon points="156,98 192,66 178,104"/>
            <polygon points="162,122 200,96 186,130"/>
            <polygon points="168,146 200,128 188,152"/>
          </g>

          <!-- Emaciated Upright Torso, Dragging Tail & Massive Jaw -->
          <path d="M252,182 C226,180 206,170 194,152 C184,136 178,112 172,88 C168,66 162,44 150,32 C142,24 128,22 116,26 L84,32 C78,34 77,39 81,42 L104,45 L102,51 L80,53 C77,55 78,60 83,60 L106,58 C104,70 96,80 84,87 L62,96 L58,108 L67,107 L72,101 L92,96 C92,118 88,142 78,168 L68,186 L150,186 C154,170 156,158 164,160 C184,166 210,178 254,184 Z" fill="url(#shinBodyGrad)" stroke="#78350f" stroke-width="1.3"/>

          <!-- Gaping Unjointed Maw with Interior Glow -->
          <polygon points="82,41 106,44 104,51 84,52 94,47" fill="#f97316"/>

          <!-- Upper & Lower Jagged Teeth -->
          <g fill="#fef2f2">
            <polygon points="84,41 87,45 90,42"/>
            <polygon points="92,42 95,46 97,43"/>
            <polygon points="99,43 101,46 103,44"/>
            <polygon points="83,52 86,48 89,51"/>
            <polygon points="91,51 94,47 97,50"/>
          </g>

          <!-- Lidless Staring Eye -->
          <circle cx="102" cy="34" r="5" fill="#fef08a" stroke="#160404" stroke-width="1"/>
          <circle cx="102" cy="34" r="2" fill="#160404"/>

          <!-- Bleeding Gill Seams & Exposed Ribs -->
          <g stroke="#f97316" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
            <path d="M124,56 C120,64 120,72 124,80"/>
            <path d="M131,58 C127,66 127,74 131,82"/>
            <path d="M104,78 C118,82 132,82 146,76"/>
            <path d="M101,92 C117,97 135,97 151,90"/>
            <path d="M99,106 C117,112 137,112 155,104"/>
            <path d="M97,120 C117,126 139,126 157,118"/>
          </g>

          <!-- Vestigial Arm -->
          <path d="M118,90 L98,106 L84,104 L78,112 L86,112 L91,107 L104,112 L124,100" fill="#450a0a" stroke="#78350f" stroke-width="1.2"/>
        </svg>
