<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190" style="filter: drop-shadow(0 6px 18px rgba(0,0,0,0.95))" fill="none">
  <defs>
    <linearGradient id="kzGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <!-- Storm wings -->
  <path d="M140,152 L60,122 L30,82 L84,98 L120,112 Z" fill="#451a03" stroke="#fbbf24" stroke-width="1.3"/>
  <path d="M140,152 L220,122 L250,82 L196,98 L160,112 Z" fill="#451a03" stroke="#fbbf24" stroke-width="1.3"/>
  <!-- Central torso -->
