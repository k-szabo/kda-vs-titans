  <!-- Three spread serpent necks, drawn over the torso -->
  <path d="M122,132 Q92,104 72,70" stroke="url(#kzGold)" stroke-width="11" stroke-linecap="round"/>
  <path d="M140,128 Q132,94 128,60" stroke="url(#kzGold)" stroke-width="11" stroke-linecap="round"/>
  <path d="M158,132 Q188,104 208,70" stroke="url(#kzGold)" stroke-width="11" stroke-linecap="round"/>
  <!-- Three horned heads -->
  <path d="M60,70 L72,46 L76,66 L86,52 L82,72 Z" fill="#b45309" stroke="#fde68a" stroke-width="1.2"/>
  <path d="M116,60 L128,32 L132,56 L142,40 L138,62 Z" fill="#b45309" stroke="#fde68a" stroke-width="1.2"/>
  <path d="M196,72 L206,48 L210,68 L220,54 L216,74 Z" fill="#b45309" stroke="#fde68a" stroke-width="1.2"/>
  <circle cx="74" cy="64" r="3" fill="#ef4444"/>
  <circle cx="129" cy="54" r="3" fill="#ef4444"/>
  <circle cx="208" cy="66" r="3" fill="#ef4444"/>
</svg>
