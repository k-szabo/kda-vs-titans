<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190" style="filter: drop-shadow(0 6px 18px rgba(0,0,0,0.95))" fill="none">
  <defs>
    <linearGradient id="megShell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="55%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#422006"/>
    </linearGradient>
  </defs>
  <!-- Burrowing legs -->
  <path d="M108,134 L78,152 L58,148 M112,146 L84,170 L66,172 M172,134 L202,152 L222,148 M168,146 L196,170 L214,172" stroke="#422006" stroke-width="4" stroke-linecap="round"/>
  <!-- Armored beetle body -->
  <ellipse cx="140" cy="128" rx="38" ry="34" fill="url(#megShell)" stroke="#fef08a" stroke-width="1.3"/>
  <path d="M140,94 L140,162" stroke="#422006" stroke-width="2" opacity="0.7"/>
  <path d="M112,118 L168,118 M108,134 L172,134" stroke="#422006" stroke-width="1.2" opacity="0.6"/>
  <!-- Twin drill horns -->
  <path d="M126,98 L104,52 L122,70 L118,88 Z" fill="#d6d3d1" stroke="#78716c" stroke-width="1.3"/>
  <path d="M154,98 L176,52 L158,70 L162,88 Z" fill="#d6d3d1" stroke="#78716c" stroke-width="1.3"/>
  <path d="M112,64 L118,58 M168,64 L162,58" stroke="#e7e5e4" stroke-width="1.2"/>
  <!-- Glowing eyes -->
  <circle cx="130" cy="108" r="4" fill="#ef4444" stroke="#450a0a" stroke-width="1"/>
  <circle cx="150" cy="108" r="4" fill="#ef4444" stroke="#450a0a" stroke-width="1"/>
  <!-- Horn crown spikes -->
  <polygon points="140,94 132,78 140,84 148,78" fill="#a8a29e" stroke="#57534e" stroke-width="1"/>
</svg>
